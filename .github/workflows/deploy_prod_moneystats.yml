# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: 🚀 Deploy Production
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  NODE_VERSION: "22.0.0"
  DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  DOCKER_REPOSITORY: ${{ vars.DOCKER_REPOSITORY }}
  #ORGANIZATION_USERNAME: ${{ secrets.ORGANIZATION_USERNAME }}
  ORGANIZATION_USERNAME: ${{ vars.ORGANIZATION_USERNAME }}
  #DESTINATION_REPOSITORY: ${{ secrets.DESTINATION_REPOSITORY }}
  DESTINATION_REPOSITORY: ${{ vars.DESTINATION_REPOSITORY }}
  API_TOKEN: ${{ secrets.API_TOKEN }}
  #EMAIL: ${{ secrets.EMAIL }}
  EMAIL: ${{ vars.EMAIL }}

jobs:
  checkout-and-setup:
    name: 🔧 Checkout and Setup
    runs-on: ubuntu-latest
    steps:
      - name: "☁️ Checkout Repository"
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "${{ env.NODE_VERSION }}"

  dependency-and-build:
    name: 📦 Install and Build
    runs-on: ubuntu-latest
    needs: checkout-and-setup
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 📦 Dependency Injection
        run: |
          npm install -g @angular/cli
          npm install --force
      - name: 📂 Build
        run: npm run staging

  docker-login:
    name: 🐳 Docker Login
    runs-on: ubuntu-latest
    needs: dependency-and-build
    steps:
      - name: 🐳 Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    environment:
      name: prod-moneystats-angular
    needs: [dependency-and-build, docker-login]
    outputs:
      release_version: ${{ steps.meta.outputs.release_version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      image_name: ${{ steps.meta.outputs.image_name }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 🗝️ Grant execute permission to script
        run: chmod +x ./rename.sh

      - name: ✅ Get current package version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

      - name: 📝 Set Release Metadata
        id: meta
        run: |
          VERSION=${{ steps.package-version.outputs.current-version}}
          TAG_NAME="v${VERSION}"
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME_LOWER="${IMAGE_NAME,,}"

          echo "release_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

      - name: Build & push Docker image
        uses: mr-smithers-excellent/docker-build-push@v7.0
        with:
          image: ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_REPOSITORY }}
          tags: ${{ steps.package-version.outputs.current-version}}, latest
          registry: docker.io
          dockerfile: Dockerfile
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
          buildArgs: config=prod
          multiPlatform: true
          platform: linux/amd64,linux/arm64

  deploy-github-pages:
    name: 🚀 Deploy on Github Pages
    runs-on: ubuntu-latest
    environment:
      name: prod-moneystats-angular
      url: https://moneystats.github.io
    needs: [dependency-and-build]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: ✅ Get current package version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

      - name: ✏️ Create .env file
        run: |
          echo "MONEYSTATS_SERVICE_URL=${{ vars.MONEYSTATS_SERVICE_URL }}" > .env
          echo "ACCESS_SPHERE_SERVICE_URL=${{ vars.ACCESS_SPHERE_SERVICE_URL }}" >> .env
          echo "IMAGE_SIZE=${{ vars.IMAGE_SIZE }}" >> .env
          echo "CACHE_ENABLE=${{ vars.CACHE_ENABLE }}" >> .env
          echo "CACHE_TIMEOUT=${{ vars.CACHE_TIMEOUT }}" >> .env

      - name: 📂 Build
        run: |
          npm install -g @angular/cli
          npm install --force
          ng build --configuration=production --output-hashing=none --base-href "https://${{ env.DESTINATION_REPOSITORY }}"

      - name: 🚀 Pushes to github pages
        uses: cpina/github-action-push-to-another-repository@main
        env:
          name: prod-moneystats-angular
          url: https://moneystats.github.io
          API_TOKEN_GITHUB: ${{ env.API_TOKEN }}
        with:
          commit-message: MoneyStats V${{ steps.package-version.outputs.current-version }}
          source-directory: "dist/angular-moneystats"
          destination-github-username: "${{ env.ORGANIZATION_USERNAME }}"
          destination-repository-name: "${{ env.DESTINATION_REPOSITORY }}"
          user-email: ${{ env.EMAIL }}
          target-branch: main

  create-release:
    name: 🏷️ Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [deploy, deploy-github-pages]
    permissions:
      contents: write
    steps:
      - name: "☁️ Checkout Repository"
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: 📝 Generate Release Changelog
        id: changelog
        env:
          TAG_NAME: ${{ needs.deploy-docker.outputs.tag_name }}
          VERSION: ${{ needs.deploy-docker.outputs.release_version }}
          IMAGE_NAME: ${{ needs.deploy-docker.outputs.image_name }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..HEAD --oneline --no-merges --pretty=format:"* %s (%h)")
          else
            COMMITS=$(git log -n 20 --oneline --no-merges --pretty=format:"* %s (%h)")
          fi

          cat <<EOF > release_notes.md
          # MoneyStats ${TAG_NAME}

          New version of **MoneyStats** successfully built and deployed to GitHub Container Registry.

          ### 📦 Release Details
          - **Version:** \`${VERSION}\`
          - **Tag:** \`${TAG_NAME}\`
          - **Docker Image:** \`${IMAGE_NAME}:${VERSION}\`

          ### 🛠️ Changes Included
          ${COMMITS}
          EOF

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.deploy-github-pages.outputs.tag_name }}
          name: ${{ needs.deploy-github-pages.outputs.tag_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.API_TOKEN }}
